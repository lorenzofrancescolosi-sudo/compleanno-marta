<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ops!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500&display=swap" rel="stylesheet">
    <style>
        .fallita-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem 2rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            border: 4px solid #ff4081;
            max-width: 90%;
        }
        .fallita-text {
            font-family: 'Fredoka One', cursive;
            color: #ff4081;
            font-size: 2.2rem;
            margin: 0;
            line-height: 1.3;
        }
    </style>
</head>
<body>
    <audio id="goofy-audio" autoplay>
        <source src="song/goofy-ahh-laugh-meme.mp3" type="audio/mpeg">
    </audio>
    <div class="fallita-card">
        <p class="fallita-text">cosa clicchi sul mio nome fallita</p>
        <img src="images/cavallo.png" alt="Cavallo" style="margin-top: 20px; max-width: 100%; height: auto; border-radius: 15px; border: 3px solid #ff4081;">
    </div>
    <script>
        window.onload = function() {
            var audio = document.getElementById("goofy-audio");
            audio.play().catch(function(error) {
                console.log("Autoplay was prevented.", error);
            });
        }
    </script>
</body>
</html>
