<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buon Compleanno!</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font festoso -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header class="animate-pop">
            <h1 class="glow">Tanti Auguri, [Nome Amico]! 🎂</h1>
            <p class="subtitle">Oggi si festeggia una persona speciale.</p>
        </header>

        <section class="card animate-slide-up">
            <div class="photo-placeholder">
                <!-- Inserisci qui una foto del tuo amico -->
                <img src="https://via.placeholder.com/150" alt="Foto festeggiato">
            </div>
            <div class="message">
                <p>"Un altro anno di avventure, risate e ricordi indimenticabili. Grazie per essere come sei!"</p>
            </div>
        </section>

        <button id="confetti-btn">Clicca per la sorpresa! 🎉</button>
    </div>

    <!-- Script per i coriandoli -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
